<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small real-time chat app built with Express and Socket.IO."
    />
    <title>Orbit Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="nav-rail" aria-label="Main navigation">
        <a class="brand-mark" href="/" aria-label="Orbit Chat home">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path
              d="M16 3.5c-7 0-12.5 4.7-12.5 10.6 0 3.2 1.7 6.1 4.5 8.1l-.8 5.3 5.4-2.7c1.1.3 2.2.4 3.4.4 7 0 12.5-4.7 12.5-10.6S23 3.5 16 3.5Z"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            />
            <circle cx="11" cy="14" r="1.3" fill="currentColor" />
            <circle cx="16" cy="14" r="1.3" fill="currentColor" />
            <circle cx="21" cy="14" r="1.3" fill="currentColor" />
          </svg>
        </a>
        <nav class="rail-nav">
          <button class="rail-button is-active" type="button" aria-label="Chats" title="Chats">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 8 8 0 0 1-3.5-.8L4 20l1.5-4.2A7.5 7.5 0 1 1 20 11.5Z" /><path d="M8.5 11.5h.01M12.5 11.5h.01M16.5 11.5h.01" /></svg>
          </button>
          <button class="rail-button" type="button" data-coming-soon="Calls are not part of this demo yet." aria-label="Calls" title="Calls">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 3.5h2.5l1.2 4.2-1.8 1.8a15 15 0 0 0 5.4 5.4l1.8-1.8 4.2 1.2v2.5a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 5.2 5.7a2 2 0 0 1 2-2.2Z" /></svg>
          </button>
          <button class="rail-button" type="button" data-coming-soon="Your contacts will live here in a future step." aria-label="Contacts" title="Contacts">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3" /><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 5.5a3 3 0 0 1 0 5.8M17 14a5 5 0 0 1 3.5 4.8" /></svg>
          </button>
          <button class="rail-button" type="button" data-coming-soon="Notifications will be added next." aria-label="Notifications" title="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" /></svg>
          </button>
        </nav>
        <div class="rail-bottom">
          <button class="rail-button" type="button" data-coming-soon="Settings will be added in a future step." aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.8 1L15.7 21h-2.8l-.3-2.1a8 8 0 0 1-1.8-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.2 1.4-2.4 1.7.7a8 8 0 0 1 1.8-1L12.9 6h2.8l.3 2.1a8 8 0 0 1 1.8 1l1.7-.7 1.4 2.4-1.4 1.2a7 7 0 0 1-.1 3Z" transform="translate(-1 -1)" /></svg>
          </button>
          <span class="rail-divider"></span>
          <button class="rail-profile" id="rail-profile" type="button" aria-label="Edit your profile"></button>
        </div>
      </aside>

      <aside class="chat-sidebar" aria-label="Chats">
        <header class="sidebar-header">
          <div>
            <p class="eyebrow">YOUR WORKSPACE</p>
            <h1>Messages</h1>
          </div>
          <button class="icon-button new-chat-button" id="new-chat-button" type="button" aria-label="Find a conversation" title="Find a conversation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </header>

        <label class="chat-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" /><path d="m16 16 4.2 4.2" /></svg>
          <input id="chat-search" type="search" placeholder="Search or start a chat" autocomplete="off" aria-label="Search conversations" />
          <kbd>Ctrl K</kbd>
        </label>

        <div class="filter-tabs" role="group" aria-label="Filter conversations">
          <button class="filter-tab is-active" type="button" data-filter="all">All</button>
          <button class="filter-tab" type="button" data-filter="unread">Unread</button>
          <button class="filter-tab" type="button" data-filter="groups">Groups</button>
        </div>

        <div class="section-label">
          <span>RECENT</span>
          <button class="text-button" id="sort-button" type="button" title="Conversation order">Newest</button>
        </div>
        <div class="conversation-list" id="conversation-list"></div>

        <footer class="sidebar-footer">
          <button class="profile-button" id="open-profile" type="button">
            <span class="avatar avatar-user" id="profile-avatar"></span>
            <span class="profile-copy">
              <strong id="profile-name"></strong>
              <span>Personal account</span>
            </span>
            <svg class="profile-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" /></svg>
          </button>
        </footer>
      </aside>

      <main class="conversation-panel" id="conversation-panel">
        <header class="conversation-header">
          <button class="icon-button mobile-back" id="back-to-list" type="button" aria-label="Back to conversations">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <span class="avatar header-avatar" id="header-avatar"></span>
          <div class="header-person">
            <h2 id="header-name"></h2>
            <p id="header-presence"></p>
          </div>
          <div class="header-actions">
            <button class="icon-button" type="button" data-coming-soon="Voice calls are not part of this demo yet." aria-label="Start voice call" title="Voice call">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 3.5h2.5l1.2 4.2-1.8 1.8a15 15 0 0 0 5.4 5.4l1.8-1.8 4.2 1.2v2.5a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 5.2 5.7a2 2 0 0 1 2-2.2Z" /></svg>
            </button>
            <button class="icon-button" type="button" data-coming-soon="Video calls are not part of this demo yet." aria-label="Start video call" title="Video call">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2" /><path d="m16 10 5-3v10l-5-3" /></svg>
            </button>
            <span class="action-divider"></span>
            <button class="icon-button" id="details-toggle" type="button" aria-label="Toggle conversation details" title="Conversation details">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" /></svg>
            </button>
          </div>
        </header>

        <section class="message-area" id="message-area" aria-label="Conversation messages">
          <div class="message-date"><span>Today</span></div>
          <div class="message-list" id="message-list" aria-live="polite"></div>
        </section>

        <div class="composer-wrap">
          <form class="composer" id="message-form">
            <button class="icon-button composer-emoji" id="emoji-button" type="button" aria-label="Add a smiley">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M8.5 14.5s1.2 2 3.5 2 3.5-2 3.5-2M9 9.5h.01M15 9.5h.01" /></svg>
            </button>
            <input id="message-input" maxlength="1000" placeholder="Write a message..." autocomplete="off" aria-label="Write a message" />
            <span class="composer-hint">Enter to send</span>
            <button class="send-button" type="submit" aria-label="Send message" title="Send message">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7.2 18-3.8-7-7-3.8L21 3Z" /><path d="M10 14 21 3" /></svg>
            </button>
          </form>
          <p class="composer-note" id="connection-status"><span class="status-dot"></span> Connecting to chat...</p>
        </div>
      </main>

      <aside class="details-panel" id="details-panel" aria-label="Conversation details">
        <header class="details-header">
          <h2>Details</h2>
        </header>
        <div class="details-content">
          <section class="contact-card">
            <span class="avatar contact-avatar" id="details-avatar"></span>
            <h3 id="details-name"></h3>
            <p id="details-role"></p>
            <span class="presence-pill"><span class="status-dot"></span><span id="details-presence"></span></span>
            <p class="contact-about" id="details-about"></p>
          </section>

          <section class="details-section">
            <div class="details-section-heading">
              <h3>Shared media</h3>
              <button class="text-button" type="button" data-coming-soon="Media sharing is not enabled in this demo.">See all</button>
            </div>
            <div class="media-grid" aria-label="Sample shared media">
              <div class="media-tile media-one"><span>UI concept</span></div>
              <div class="media-tile media-two"><span>Workspace</span></div>
              <div class="media-tile media-three"><span>Notes</span></div>
            </div>
          </section>

          <section class="details-section details-links">
            <details open>
              <summary>
                <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h5" /></svg> About this chat</span>
                <svg class="summary-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" /></svg>
              </summary>
              <p id="details-description"></p>
            </details>
            <details>
              <summary>
                <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3" /><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 5.5a3 3 0 0 1 0 5.8M17 14a5 5 0 0 1 3.5 4.8" /></svg> Members</span>
                <svg class="summary-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" /></svg>
              </summary>
              <p id="details-members"></p>
            </details>
            <button class="details-link" type="button" data-coming-soon="Notification preferences will be added later.">
              <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" /></svg> Notifications</span>
              <span class="link-value">On</span>
            </button>
          </section>
        </div>
      </aside>
    </div>

    <dialog class="profile-dialog" id="profile-dialog">
      <form id="profile-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">YOUR PROFILE</p>
            <h2>Choose a display name</h2>
          </div>
          <button class="icon-button" id="close-profile" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <label class="profile-input-label" for="display-name-input">Name shown with your messages</label>
        <input id="display-name-input" maxlength="24" required />
        <div class="dialog-actions">
          <button class="secondary-button" id="cancel-profile" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save name</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js" defer></script>
  </body>
</html>
