<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; }
    .chat-container { max-width: 600px; margin: 0 auto; }
    #chat-box { height: 400px; border: 1px solid #444; background: #242424; padding: 15px; overflow-y: auto; margin-bottom: 15px; }
    .message { padding: 8px 12px; border-bottom: 1px solid #333; word-break: break-word; }
    .input-area { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; background: #333; border: 1px solid #555; color: white; }
    button { padding: 12px 24px; background: #646cff; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="chat-container">
    <h2>Real-Time Chat</h2>
    <div id="chat-box"></div>
    <div class="input-area">
      <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    socket.on('receive_message', (text) => {
      const line = document.createElement('div');
      line.className = 'message';
      line.textContent = text;
      chatBox.appendChild(line);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text === '') return;
      socket.emit('send_message', text);
      messageInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
